[project]
name = "jev-as-quant"
version = "0.1.0"
description = "Typed System-1 decisions (Laya / Jev) as the judgment layer of a quant research stack, with Claude as System 2."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
laya = ["laya>=0.3.5"]
data = ["yfinance>=0.2.40", "huggingface_hub>=0.20"]
claude = ["anthropic>=1.0"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]
all = ["jev-as-quant[laya,data,claude,mcp,dev]"]

[project.scripts]
jevquant = "jevquant.cli:main"
jevquant-mcp = "jevquant.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["laya: needs the Laya checkpoint (set JEVQUANT_TEST_LAYA=1)"]
